[workspace]
members = [
    "crates/runtime",
    "crates/api",
    "crates/domain", "crates/application", "crates/config",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
axum = "0.8"
